name: afterglow
description: Your GitHub year as a spinning ASCII torus, with whoami, your latest posts and your links, drawn as one terminal session for a profile README.
author: Koray Güler
branding:
  icon: terminal
  color: green

inputs:
  user:
    description: GitHub login whose contribution calendar is drawn.
    default: ${{ github.repository_owner }}
  token:
    description: Token for the GraphQL contribution calendar. The workflow's own token is enough.
    default: ${{ github.token }}
  prompt:
    description: Shell prompt printed before every command, e.g. `koray@istanbul ~ %`. Defaults to `<login> ~ %`.
    default: ""
  whoami:
    description: Lines printed by `whoami`. The first is set large as your name; blank lines are kept. Defaults to your GitHub name and bio.
    default: ""
  feed:
    description: RSS or Atom feed URL. When set, the newest posts are listed, each line linking to its post.
    default: ""
  feed_note:
    description: Lines printed as `#` comments above the post list.
    default: ""
  posts:
    description: How many posts to list, 1 to 20.
    default: "5"
  posts_url:
    description: Where the closing "all of them at" line points. Defaults to the site the feed names.
    default: ""
  links:
    description: One link per line as `label url`, printed by `cat links`. The first one is where `whoami` links.
    default: ""
  out:
    description: Directory the SVGs are written to. Publish it to the branch `base_url` points at.
    default: afterglow
  readme:
    description: README to update between `<!-- afterglow:start -->` and `<!-- afterglow:end -->`. Empty to leave it alone; the block is always written to `<out>/README.block.md`.
    default: README.md
  base_url:
    description: URL the README loads the SVGs from. Defaults to `https://raw.githubusercontent.com/<owner>/<repo>/output`.
    default: ""

runs:
  using: node24
  main: dist/index.mjs
